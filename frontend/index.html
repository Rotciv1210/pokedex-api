<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokedex API</title>
  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="logo">
      <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png" alt="pokeball" />
      <span>Pokédex</span>
    </div>
    <nav>
      <button class="nav-btn active" data-section="browse">Explorar</button>
      <button class="nav-btn" data-section="favorites">Favoritos</button>
      <button class="nav-btn" data-section="teams">Equipos</button>
      <button class="nav-btn" data-section="compare">Comparar</button>
    </nav>
  </header>

  <!-- BROWSE -->
  <section id="browse" class="section active">
    <div class="search-bar">
      <input id="search-input" type="text" placeholder="Buscar Pokémon..." />
      <button id="search-btn">Buscar</button>
    </div>
    <div id="pokemon-grid" class="grid"></div>
    <div class="pagination">
      <button id="prev-btn" disabled>← Anterior</button>
      <span id="page-info">Página 1</span>
      <button id="next-btn">Siguiente →</button>
    </div>
  </section>

  <!-- FAVORITES -->
  <section id="favorites" class="section">
    <h2>Mis Favoritos</h2>
    <div id="favorites-grid" class="grid"></div>
    <p id="favorites-empty" class="empty-msg">No tienes favoritos aún. Explora Pokémon y añádelos con ★</p>
  </section>

  <!-- TEAMS -->
  <section id="teams" class="section">
    <div class="teams-header">
      <h2>Mis Equipos</h2>
      <div class="create-team">
        <input id="team-name-input" type="text" placeholder="Nombre del equipo" />
        <button id="create-team-btn">+ Crear equipo</button>
      </div>
    </div>
    <div id="teams-list"></div>
    <p id="teams-empty" class="empty-msg">No tienes equipos. ¡Crea uno!</p>
  </section>

  <!-- COMPARE -->
  <section id="compare" class="section">
    <h2>Comparar Pokémon</h2>
    <div class="compare-inputs">
      <input id="compare-1" type="text" placeholder="Pokémon 1 (ej: pikachu)" />
      <input id="compare-2" type="text" placeholder="Pokémon 2 (ej: charizard)" />
      <input id="compare-3" type="text" placeholder="Pokémon 3 (opcional)" />
      <button id="compare-btn">Comparar</button>
    </div>
    <div id="compare-result"></div>
  </section>

  <!-- POKEMON DETAIL MODAL -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <button class="modal-close" id="modal-close">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
